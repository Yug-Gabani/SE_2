name: telemeet-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: telemeet-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: telemeet_db
      POSTGRES_USER: telemeet_user
      POSTGRES_PASSWORD: telemeet_password
    ports:
      - "5433:5432"
    volumes:
      - telemeet_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemeet_user -d telemeet_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: telemeet-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://telemeet_user:telemeet_password@postgres:5432/telemeet_db
      JWT_SECRET: super_secure_telemeet_production_jwt_secret_2026_key
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: nvidia/nemotron-3.5-lightning:free
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: telemeet-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  telemeet_pgdata_prod:
