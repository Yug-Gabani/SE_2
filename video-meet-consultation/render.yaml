services:
  # 1. FastAPI Backend Service
  - type: web
    name: telemeet-backend
    env: python
    region: oregon
    plan: free
    rootDir: video-meet-consultation/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telemeet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free

  # 2. React Vite Frontend Service
  - type: web
    name: telemeet-frontend
    env: static
    region: oregon
    plan: free
    rootDir: video-meet-consultation/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: telemeet-backend
          property: host

databases:
  - name: telemeet-db
    plan: free
    region: oregon
    databaseName: telemeet_db
    user: telemeet_user
